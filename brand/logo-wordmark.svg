<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 180" width="740" height="180"
     role="img" aria-label="ModalitiesQuant — multi-modal biological and market analysis">
  <!-- Horizontal lockup: mark + wordmark. Clear space around the whole lockup is
       one hexagon-width (about 38px at this size) on every side.

       The wordmark below is live text, so it renders with whatever font the
       viewer has. Before sending this to a printer or a fabricator, open it in
       Inkscape/Illustrator and convert the text to paths — otherwise it silently
       falls back to a system sans and stops being your logo. -->
  <defs>
